# Project-wide Gradle settings
kotlin.code.style=official
android.nonTransitiveRClass=true

# 1. AndroidX Support (এটি মূল সমস্যার সমাধান করবে)
android.useAndroidX=true
android.enableJetifier=false

# 2. compileSdk 36 Warning Suppress
android.suppressUnsupportedCompileSdk=36

# 3. Parallel & Memory Settings
org.gradle.parallel=true
org.gradle.caching=true
# Gradle 9.7.0 এবং KSP-এর সাথে কনফিগারেশন ক্যাশে সমস্যা তৈরি করায় এটি false করা হয়েছে
org.gradle.configuration-cache=false
org.gradle.workers.max=4

# 4. Kotlin & KSP Configurations
kotlin.compiler.execution.strategy=in-process
ksp.incremental=false

# 5. Firebase / Google Services Bypass
googleServices.missing.passthrough=true

# 6. JVM Options (Headless Mode for GitHub Actions)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
