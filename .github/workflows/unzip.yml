name: Extract ZIP and Setup Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ১. ফাইল লিস্ট পরীক্ষা করা (Debug Step)
      - name: List Files
        run: ls -la

      # ২. ফাইল না থাকলে স্ক্রিপ্ট সাবধানে হ্যান্ডেল করবে
      - name: Extract ZIP safely
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in root directory!"
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted

      # ৩. ফাইল সেফ কপি করা
      - name: Copy files safely
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.workspace' \
            --exclude='node_modules' \
            extracted/ ./
          rm -rf extracted
          rm -f *.zip

      # ৪. gradlew ফাইলকে এক্সিকিউটেবল পারমিশন দেওয়া
      - name: Make gradlew executable
        run: |
          chmod +x gradlew || true

      # ৫. কোড গিট-এ আপডেট করা
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto Unzip and Project Setup" || echo "No changes to commit"
          git push
          
