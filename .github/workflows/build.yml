name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found! Generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    # ১. কাস্টম debug.keystore ফাইল জেনারেট করা
    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # ২. ডমি google-services.json ফাইল তৈরি (যদি না থাকে)
    - name: Generate Dummy google-services.json if missing
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"000000000000","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.example.slmweather"}},"api_key":[{"current_key":"dummy_api_key"}]}],"configuration_version":"1"}' > app/google-services.json
        fi

    # ৩. Debug APK বিল্ড
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # ৪. APK ফাইল আপলোড
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Weather-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
